[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlihawk"
version = "0.1.0"
description = "Conservative SQL injection signal checks for authorized testing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["requests>=2.31.0,<3.0.0"]
authors = [{ name = "Kritik Bhattarai" }]

[project.scripts]
sqlihawk = "sqlihawk:main"

[tool.setuptools]
py-modules = ["sqlihawk"]
